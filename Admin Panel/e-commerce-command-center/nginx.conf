server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # AP8/S13: Content-Security-Policy. Allowances exist for concrete
    # dependencies — remove the dependency before removing its source:
    #   accounts.google.com (script/style/frame/connect) — admin Google Sign-In
    #     button (@react-oauth/google GIS): the gsi/client script, its gsi/style
    #     stylesheet, and the button iframe. Dropping these BREAKS it.
    # NOTE: in production the panel is reached THROUGH the storefront nginx
    # (location /panel/), which adds its own policy on top. A browser enforces
    # both, so a source has to be allowed in BOTH files to work.
    #   'unsafe-inline' styles — Tailwind utilities + inline styles.
    # img https: covers Cloudinary/S3 product images in the catalog grids.
    # NOTE: any location below with its own add_header repeats this line —
    # nginx drops inherited headers as soon as a location defines one.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; connect-src 'self' https://accounts.google.com; frame-src 'self' https://accounts.google.com" always;

    # Runtime config must never be cached (regenerated per container start).
    # Exact-match location wins over the regex cache rule below.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; connect-src 'self' https://accounts.google.com; frame-src 'self' https://accounts.google.com" always;
    }

    # The HTML shell must never be cached, or an admin keeps running an old
    # bundle after a deploy. Hashed files under /assets/ stay cached for a year.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; connect-src 'self' https://accounts.google.com; frame-src 'self' https://accounts.google.com" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; connect-src 'self' https://accounts.google.com; frame-src 'self' https://accounts.google.com" always;
    }

    # Handle SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; font-src 'self'; connect-src 'self' https://accounts.google.com; frame-src 'self' https://accounts.google.com" always;
    }
}
