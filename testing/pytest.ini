[pytest]
markers =
    smoke: fast happy-path checks that the API is alive and core flows work
    auth: authentication / authorization flows
    catalog: product/category/combo browsing and search
    cart: cart and favorites flows
    security: Faultline-style adversarial / abuse-case probes
    destructive: tests that write data AND cannot undo it (skipped against prod by default)
    order: order lifecycle — place / cancel / restock / coupons (self-cleaning)
    payment: Razorpay endpoints — non-charging HTTP surface (charging path is the browser test)
    review: verified-purchase reviews and the can-review gate
    assistant: AI shopping assistant (login-only) access + Q&A
    support: public contact form + admin-only inbox
addopts = -ra -v --tb=short
