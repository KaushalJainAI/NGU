# The host nginx terminates TLS and proxies here over plain HTTP, so $scheme is
# always "http" inside this container. Forwarding $scheme would overwrite the
# host's "X-Forwarded-Proto: https" and leave Django's SECURE_PROXY_SSL_HEADER
# permanently seeing http. Honour the incoming header; fall back to $scheme only
# when there is no upstream proxy (local dev hitting :3000 directly).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}



# Proxy cache configuration
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=s3_cache:10m max_size=1g inactive=60m use_temp_path=off;
proxy_temp_path /var/cache/nginx/temp;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. With a variable in proxy_pass, nginx re-resolves the
    # container name at request time, so recreating the backend or admin-panel
    # container no longer needs `nginx -s reload`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    set $admin_upstream http://admin-panel:80;

    # Redirects must stay relative: this server listens on plain :80 behind the
    # TLS-terminating host nginx, so an absolute redirect would say http://.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # AP8/S13: Content-Security-Policy. Each allowance exists for a concrete
    # dependency — remove the dependency before removing its source:
    #   fonts.googleapis.com / fonts.gstatic.com — Inter webfont (index.html).
    #   checkout.razorpay.com (script/connect/frame) + api.razorpay.com
    #     (connect/frame) — Razorpay Checkout.js modal. Dropping these BREAKS
    #     online payment.
    #   cdn.razorpay.com (script) — checkout.js pulls its risk-detection bundle
    #     from there when the modal opens.
    #   *.razorpay.com (connect/frame) — the modal also talks to
    #     lumberjack.razorpay.com and cdn.razorpay.com, not only api/checkout.
    #   accounts.google.com (script/style/connect/frame) — "Sign in with
    #     Google" on /login (Google Identity Services: the gsi/client script,
    #     its stylesheet, and the button + One Tap iframes). Dropping these
    #     BREAKS Google sign-in.
    #   www.google.com (frame) — store-locator map embed on /contact.
    #   img blob: — locally generated previews/downloads.
    #   'unsafe-inline' styles — Tailwind utilities + the index.html boot shell.
    # img https: covers Cloudinary/S3 product images. No openrouter.ai: the
    # storefront never calls OpenRouter directly (all AI goes via /api/*).
    # NOTE: any location below with its own add_header repeats this line —
    # nginx drops inherited headers as soon as a location defines one.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.razorpay.com https://accounts.google.com; frame-src 'self' https://*.razorpay.com https://accounts.google.com https://www.google.com" always;

    # SEO files come from the backend so the sitemap reflects the live catalog.
    # Must be declared before the SPA catch-all, which would otherwise serve
    # index.html for /sitemap.xml and hand crawlers HTML instead of XML.
    location = /sitemap.xml {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /robots.txt {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 1. Backend API
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        
        # Enable caching for media files in API responses if needed
        # But specifically proxy S3 below
        
        client_max_body_size 50M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy S3 bucket for better performance and caching
    location ^~ /s3-media/ {
        proxy_cache s3_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_hide_header Set-Cookie;
        
        # Proxy to the actual S3 bucket
        proxy_pass https://ngu-static-files0.s3.ap-south-1.amazonaws.com/;

        proxy_set_header Host ngu-static-files0.s3.ap-south-1.amazonaws.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-meta-server-side-encryption;
        proxy_hide_header x-amz-server-side-encryption;
        proxy_hide_header x-amz-version-id;

        # Intercept errors if S3 returns 404
        proxy_intercept_errors on;

        add_header X-Cache-Status $upstream_cache_status;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.razorpay.com https://accounts.google.com; frame-src 'self' https://*.razorpay.com https://accounts.google.com https://www.google.com" always;
    }

    # AP7a/S6: the Django admin proxy block was REMOVED (2026-10-01). /admin/
    # sat on the public internet with password-only login and no rate limit
    # (DRF throttles don't apply to it). Staff use the admin panel at /panel/;
    # Django admin is reachable only via SSH tunnel / private network now.
    # To restore public access (needs explicit owner sign-off, §7.2): re-add a
    # location /admin/ with `allow <office-ip>; deny all;` plus a login
    # lockout (django-axes, 5 fails → 30-min lock). Do NOT restore the open
    # proxy that was here.

    # 2b. Django static files (admin/DRF CSS+JS), served by WhiteNoise from the
    # backend. ^~ so /static/admin/*.css|js beats the regex asset-cache location
    # below; otherwise they'd resolve against the SPA filesystem and 404.
    location ^~ /static/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # /panel without the trailing slash used to fall through to the storefront.
    location = /panel {
        return 301 /panel/;
    }

    # 3. Admin Panel - React App (accessed at /panel/)
    # ^~ so this prefix beats the regex asset-cache location below; otherwise
    # /panel/assets/*.js|css get caught by that regex and 404 from the frontend fs.
    location ^~ /panel/ {
        # The rewrite handles stripping /panel so the React app loads correctly
        rewrite ^/panel/(.*)$ /$1 break;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # Runtime config must never be cached (regenerated per container start).
    # Exact-match location wins over the regex cache rule below, which would
    # otherwise pin /config.js for a year and freeze the runtime env.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.razorpay.com https://accounts.google.com; frame-src 'self' https://*.razorpay.com https://accounts.google.com https://www.google.com" always;
    }

    # 4. Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.razorpay.com https://accounts.google.com; frame-src 'self' https://*.razorpay.com https://accounts.google.com https://www.google.com" always;
    }

    # The HTML shell must never be cached, or customers keep running an old
    # bundle after a deploy. Hashed files under /assets/ stay cached for a year.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.razorpay.com https://accounts.google.com; frame-src 'self' https://*.razorpay.com https://accounts.google.com https://www.google.com" always;
    }

    # 5. Frontend SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.razorpay.com https://accounts.google.com; frame-src 'self' https://*.razorpay.com https://accounts.google.com https://www.google.com" always;
    }
}
