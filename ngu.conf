# NGU host nginx config — deploy to /etc/nginx/conf.d/ngu.conf on the app server.
# Topology: host nginx (80/443) -> frontend container (:3000), which internally
# routes / (storefront), /api/ (backend), /panel/ (admin), /admin/ (Django).
# TLS: Let's Encrypt certs issued via dockerized certbot (webroot), one lineage per
# domain. No Cloudflare — both domains resolve straight to this origin.
# See DEPLOYMENT.md Part 6.
# NOTE: add a 443 server block only AFTER its cert exists, or `nginx -t` fails.
#
# Block order matters: conf.d/*.conf is included BEFORE the stock server in nginx.conf,
# so the FIRST `listen 80` block here is the implicit default server for :80. The bare-IP
# block must stay first — otherwise unknown hosts fall into the redirect block and get
# sent to an HTTPS URL that no cert covers.

# Default for :80 — bare IP and unknown hosts keep proxying (no redirect; the TLS
# certs do not cover the IP literal, so redirecting would break IP access).
server {
    listen 80;
    server_name 13.235.238.99;

    # Let's Encrypt HTTP-01 challenge — served from webroot, NOT proxied.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 500M;
    }
}

# Named domains on :80 — ACME challenge stays served (renewals depend on it),
# everything else redirects to HTTPS.
server {
    listen 80;
    server_name nidhimasala.com www.nidhimasala.com nidhigrahudyog.com www.nidhigrahudyog.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# nidhimasala.com — primary storefront domain.
server {
    listen 443 ssl;
    http2 on;
    server_name nidhimasala.com www.nidhimasala.com;

    ssl_certificate     /etc/letsencrypt/live/nidhimasala.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nidhimasala.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 500M;
    }
}

# nidhigrahudyog.com — additional storefront domain (serves the same app).
